<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebAssembly POC</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; text-align: center; }
    input, button { padding: 8px; margin: 5px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>WebAssembly (Wasm) POC ⚡</h2>
  <p>Addition executed inside a binary module (.wasm):</p>

  <input type="number" id="a" value="10"> +
  <input type="number" id="b" value="25">
  <br>
  <button onclick="calculateSum()">Add with Wasm</button>

  <h3>Result: <span id="result">-</span></h3>

  <script>
    // WebAssembly binary module (.wasm) exporting: add(a, b) => a + b
    const wasmBytes = new Uint8Array([
      0x00,0x61,0x73,0x6d, 0x01,0x00,0x00,0x00,
      0x01,0x07,0x01,0x60, 0x02,0x7f,0x7f,0x01,0x7f,
      0x03,0x02,0x01,0x00, 0x07,0x07,0x01,0x03,0x61,0x64,0x64,0x00,0x00,
      0x0a,0x09,0x01,0x07, 0x00,0x20,0x00,0x20,0x01,0x6a,0x0b
    ]);

    let addWasm;

    WebAssembly.instantiate(wasmBytes).then(({ instance }) => {
      addWasm = instance.exports.add;
      console.log("✅ WebAssembly module loaded successfully");
    });

    function calculateSum() {
      const a = Number(document.getElementById('a').value);
      const b = Number(document.getElementById('b').value);
      document.getElementById('result').textContent = addWasm(a, b);
    }
  </script>
</body>
</html>
